---
- name: Assert minimum Ansible version
  ansible.builtin.assert:
    that:
      - ansible_version.full is version('2.20', '>=')
    fail_msg: >-
      realtime.proxmox_lxc requires ansible-core >= 2.20,
      but found {{ ansible_version.full }}.
    quiet: true

- name: Assert Proxmox API connection variables are set
  ansible.builtin.assert:
    that:
      - proxmox_api_host | length > 0
      - proxmox_api_user | length > 0
      - proxmox_api_token_id | length > 0
      - proxmox_api_token_secret | length > 0
    fail_msg: >-
      realtime.proxmox_lxc: proxmox_api_host, proxmox_api_user,
      proxmox_api_token_id, and proxmox_api_token_secret must all be
      set. These authenticate to the Proxmox API and have no default
      on purpose.
    quiet: true

- name: Assert container identity and placement variables are set
  ansible.builtin.assert:
    that:
      - proxmox_lxc_node | length > 0
      - proxmox_lxc_hostname | length > 0
    fail_msg: >-
      realtime.proxmox_lxc: proxmox_lxc_node and proxmox_lxc_hostname
      must both be set. There is no default -- this role never guesses
      which node or hostname to provision.
    quiet: true

- name: Assert an OS template is specified
  ansible.builtin.assert:
    that:
      - proxmox_lxc_ostemplate | length > 0
    fail_msg: >-
      realtime.proxmox_lxc: proxmox_lxc_ostemplate must be set to the
      exact template filename (e.g.
      debian-13-standard_13.0-1_amd64.tar.zst). Check `pveam available`
      on {{ proxmox_lxc_node }} for the current filename -- Proxmox
      revises these periodically, so this role does not default one.
    quiet: true

- name: Assert networking variables are set and ip_cidr looks like a CIDR
  ansible.builtin.assert:
    that:
      - proxmox_lxc_ip_cidr | length > 0
      - proxmox_lxc_gateway | length > 0
      - proxmox_lxc_ip_cidr is regex('^[0-9]{1,3}(\.[0-9]{1,3}){3}/[0-9]{1,2}$')
    fail_msg: >-
      realtime.proxmox_lxc: proxmox_lxc_ip_cidr must be set to an
      IPv4 CIDR (e.g. "192.0.2.10/24") and proxmox_lxc_gateway must be
      set. This role only handles static IPv4 assignment today -- no
      DHCP, no IPv6.
    quiet: true

- name: Assert proxmox_lxc_features is a list
  ansible.builtin.assert:
    that:
      - proxmox_lxc_features is sequence
      - proxmox_lxc_features is not mapping
    fail_msg: >-
      realtime.proxmox_lxc: proxmox_lxc_features must be a list (e.g.
      ["nesting=1"]). Use [] to disable -- not "{}" or a bare string.
    quiet: true

- name: Check that proxmoxer is importable by the control node's Python
  delegate_to: localhost
  become: false
  ansible.builtin.command:
    cmd: "{{ ansible_playbook_python }} -c 'import proxmoxer'"
  register: proxmox_lxc_proxmoxer_check
  changed_when: false
  failed_when: false

- name: Assert proxmoxer is installed for the control node's Python
  ansible.builtin.assert:
    that:
      - proxmox_lxc_proxmoxer_check.rc == 0
    fail_msg: >-
      realtime.proxmox_lxc: the 'proxmoxer' Python library is not
      importable by {{ ansible_playbook_python }} -- the control
      node's Python, since both community.proxmox.* tasks in this
      role run with delegate_to: localhost and need it there, not on
      the guest. Install it with:
      {{ ansible_playbook_python }} -m pip install proxmoxer requests
    quiet: true

- name: Resolve proxmox_lxc_root_pubkey up front, before any API calls
  # A plain `assert` on this variable would fail exactly the same way a
  # bad `lookup('file', ...)` fails deep in the create-container task --
  # referencing the variable is what re-triggers the lookup. block/rescue
  # is what actually lets us turn that into a clear preflight message
  # instead of an arg-finalization crash after a template download has
  # already happened.
  block:
    - name: Attempt to resolve proxmox_lxc_root_pubkey
      ansible.builtin.set_fact:
        proxmox_lxc_root_pubkey_resolved: "{{ proxmox_lxc_root_pubkey }}"
  rescue:
    - name: Fail with a clear message when proxmox_lxc_root_pubkey can't be resolved
      ansible.builtin.fail:
        msg: >-
          realtime.proxmox_lxc: proxmox_lxc_root_pubkey could not be
          resolved -- if it's set via lookup('file', ...), that lookup
          runs on the control node
          ({{ ansible_playbook_python | default('wherever ansible-playbook runs') }}),
          not the guest, so the path must exist there (shell
          expansions like ~ are honored, but only for that machine's
          home directory). Set it to a real, existing public key path,
          or "" to skip SSH key injection entirely.
